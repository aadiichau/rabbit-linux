# Builds the Windows installer for a version tag (v0.7.0, v0.7.1, …) and attaches it, with a SHA-256
# file, to a DRAFT release. Publishing the draft is a manual step on GitHub, after the installer has
# been checked. Ordinary commits never trigger this.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the draft release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'aadiichau/rabbit'
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match the app version everywhere
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri=$tauri npm=$npm cargo=$cargo"
          if ($tag -ne $tauri -or $tag -ne $npm -or $tag -ne $cargo) { throw "Version mismatch: tag $tag, tauri $tauri, npm $npm, cargo $cargo" }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Fetch pinned sidecars (yt-dlp, FFmpeg) and verify their SHA-256
        shell: pwsh
        run: ./scripts/fetch-sidecars.ps1
      - run: npm ci
      - name: Regenerate third-party notices (shipped in the installer)
        run: node scripts/third-party-notices.mjs

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version)) .*?\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no entry for $version" }
          $intro = @(
            "### Downloads (Windows 10 / 11, 64-bit)",
            "- **Installer (recommended):** ``Rabbit_${version}_x64-setup.exe``. Per-user install, no admin rights, Start menu entry and uninstaller.",
            "- **Portable:** ``Rabbit_${version}_x64-portable.zip``. Unzip and run ``rabbit.exe``; settings and library stay in the folder.",
            "- **Checksums:** ``SHA256SUMS.txt``. The downloads are not code-signed, so SmartScreen may warn about an unknown publisher.",
            "", "### What's new", "") -join "`n"
          $body = $intro + $m.Groups[1].Value.Trim()
          $delimiter = "NOTES_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter`n$body`n$delimiter" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build the installer and create the draft release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Rabbit ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: --bundles nsis

      - name: Pack the portable ZIP, hash both downloads, attach them with SHA256SUMS.txt
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $setup = Get-ChildItem -Recurse -Path src-tauri/target -Filter "Rabbit_${version}_x64-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw "installer not found" }
          $portable = ./scripts/make-portable.ps1 -Exe src-tauri/target/release/rabbit.exe -OutDir dist-release
          $lines = foreach ($file in $setup, $portable) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)"
            "$($file.Name): $([math]::Round($file.Length / 1MB, 1)) MiB" | Write-Host
          }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" $portable.FullName SHA256SUMS.txt --clobber
