name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 tests and packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev rpm
      - name: Test sidecar preparation (offline)
        run: python3 -m unittest discover -s scripts -p test_linux_sidecars.py
      - name: Fetch verified native tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch-sidecars-linux.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Generate Linux third-party notices
        run: node scripts/third-party-notices.mjs
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --bundles deb,rpm,appimage
      - name: Collect packages and checksums
        run: |
          mkdir -p dist-release
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp '{}' dist-release/ \;
          cd dist-release
          sha256sum *.deb *.rpm *.AppImage > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Rabbit-linux-x64
          path: dist-release/
          if-no-files-found: error
